apiVersion: v1
kind: Service
metadata:
  name: capstone-service
  namespace: capstone
  labels:
    app: capstone-app
spec:
  selector:
    app: capstone-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-service-nodeport
  namespace: capstone
spec:
  selector:
    app: capstone-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
  type: NodePort
