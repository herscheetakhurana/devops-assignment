name: Capstone CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'capstone/**'
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: devops-capstone-app
  REGISTRY: docker.io
  KUBE_NAMESPACE: capstone

jobs:
  # ─────────────────────────────────────
  # Job 1: Test
  # ─────────────────────────────────────
  test:
    name: Lint, Unit Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: capstone/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Run unit tests with coverage
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: capstone/app/coverage/

  # ─────────────────────────────────────
  # Job 2: Build & Security Scan
  # ─────────────────────────────────────
  build:
    name: Build Docker Image & Security Scan
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: capstone/docker/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Save Trivy report
        run: |
          docker run --rm aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --format json \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} > trivy-report.json || true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: capstone/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}

  # ─────────────────────────────────────
  # Job 3: Deploy to Kubernetes
  # ─────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl apply -f capstone/k8s/namespace.yaml
          kubectl apply -f capstone/k8s/deployment.yaml
          kubectl set image deployment/capstone-app \
            app=${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/capstone-app \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=180s

      - name: Run integration tests
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          sleep 15
          APP_URL=$(kubectl get svc capstone-service -n ${{ env.KUBE_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -f http://$APP_URL:3000/health && echo "Integration test PASSED"
