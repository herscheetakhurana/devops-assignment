apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-capstone-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: capstone-project
  source:
    repoURL: https://github.com/herscheetakhurana/devops-assignment.git
    targetRevision: main
    path: capstone/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
