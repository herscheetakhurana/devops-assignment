# ============================================================
# GitHub Actions CI Pipeline
# Runs on every push and pull request to main/develop branches
# ============================================================
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # Job 1: Lint & Unit Tests
  # ─────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --ci --coverage --coverageReporters=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/lcov-report/
          retention-days: 7

  # ─────────────────────────────────────────
  # Job 2: Docker Build & Security Scan
  # ─────────────────────────────────────────
  docker-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t devops-sample-app:${{ github.sha }} \
            -f lab2-containerization-kubernetes/dockerfiles/Dockerfile \
            ./app

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devops-sample-app:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

      - name: Push to Docker Hub (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
            docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag devops-sample-app:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/devops-sample-app:${{ github.sha }}
          docker tag devops-sample-app:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/devops-sample-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-sample-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-sample-app:latest

  # ─────────────────────────────────────────
  # Job 3: Validate K8s Manifests
  # ─────────────────────────────────────────
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Validate manifests (dry-run)
        run: |
          for f in lab2-containerization-kubernetes/k8s-manifests/*.yaml; do
            echo "Validating: $f"
            kubectl apply --dry-run=client -f "$f" 2>&1 || true
          done
          for f in lab4-advanced-deployment-enterprise-devops/deployment-strategies/*.yaml; do
            echo "Validating: $f"
            kubectl apply --dry-run=client -f "$f" 2>&1 || true
          done
