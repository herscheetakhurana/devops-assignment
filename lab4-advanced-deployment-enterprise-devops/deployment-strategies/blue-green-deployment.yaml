# Blue-Green Deployment - Lab 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-blue
  namespace: production
  labels: { app: devops-app, slot: blue, version: "1.0.0" }
spec:
  replicas: 3
  selector:
    matchLabels: { app: devops-app, slot: blue }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: devops-app, slot: blue, version: "1.0.0" }
    spec:
      containers:
        - name: app
          image: devops-sample-app:1.0.0
          ports: [{ containerPort: 3000 }]
          env: [{ name: SLOT, value: blue }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-green
  namespace: production
  labels: { app: devops-app, slot: green, version: "2.0.0" }
spec:
  replicas: 3
  selector:
    matchLabels: { app: devops-app, slot: green }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: devops-app, slot: green, version: "2.0.0" }
    spec:
      containers:
        - name: app
          image: devops-sample-app:2.0.0
          ports: [{ containerPort: 3000 }]
          env: [{ name: SLOT, value: green }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Active service - switch selector to change traffic
apiVersion: v1
kind: Service
metadata:
  name: devops-app-active
  namespace: production
  annotations:
    deployment.kubernetes.io/active-slot: blue
spec:
  type: ClusterIP
  selector: { app: devops-app, slot: blue }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app-blue
  namespace: production
spec:
  type: ClusterIP
  selector: { app: devops-app, slot: blue }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app-green
  namespace: production
spec:
  type: ClusterIP
  selector: { app: devops-app, slot: green }
  ports: [{ port: 3000, targetPort: 3000 }]
