# ArgoCD Application - Lab 4 GitOps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-sample-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-lab
  source:
    repoURL: https://github.com/yourusername/devops.assignment.git
    targetRevision: main
    path: lab2-containerization-kubernetes/k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
