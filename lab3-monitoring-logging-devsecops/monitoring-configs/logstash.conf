# ============================================================
# Logstash Pipeline Configuration - Lab 3
# Input: Beats (Filebeat) ? Filter ? Output: Elasticsearch
# ============================================================

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }

  # Also accept direct syslog
  syslog {
    port => 5140
    type => "syslog"
  }
}

filter {
  # Parse Node.js application logs
  if [fields][app] == "devops-sample-app" {
    json {
      source  => "message"
      target  => "app_log"
      add_tag => ["nodejs"]
    }

    date {
      match   => ["[app_log][timestamp]", "ISO8601"]
      target  => "@timestamp"
    }

    mutate {
      rename => { "[app_log][level]"   => "log_level"   }
      rename => { "[app_log][message]" => "log_message" }
    }
  }

  # Parse Nginx access logs
  if [fields][source] == "nginx" {
    grok {
      match => {
        "message" => "%{COMBINEDAPACHELOG}"
      }
      add_tag => ["nginx"]
    }

    mutate {
      convert => { "response" => "integer" }
      convert => { "bytes"    => "integer" }
    }

    geoip {
      source => "clientip"
    }
  }

  # Drop empty or debug messages
  if [log_level] == "debug" {
    drop {}
  }
}

output {
  elasticsearch {
    hosts    => ["elasticsearch:9200"]
    index    => "devops-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
