global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "lab3-monitor"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "devops-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "web01:9100"
          - "web02:9100"
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: hostname
        replacement: "$1"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
