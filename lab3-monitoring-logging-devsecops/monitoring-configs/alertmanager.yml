global:
  resolve_timeout: 5m
  smtp_from: "alerts@devops-lab.local"
  smtp_smarthost: "localhost:587"

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "lab-alerts"

  routes:
    - match:
        severity: critical
      receiver: "critical-alerts"
      repeat_interval: 1h

receivers:
  - name: "lab-alerts"
    email_configs:
      - to: "student@example.com"
        send_resolved: true

  - name: "critical-alerts"
    email_configs:
      - to: "student@example.com"
        subject: "[CRITICAL] {{ .CommonLabels.alertname }}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "job"]
