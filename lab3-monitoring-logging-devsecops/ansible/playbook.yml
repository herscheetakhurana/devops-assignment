---
# ============================================================
# Lab 3: Main Ansible Playbook
# Provisions and configures web + monitoring servers
# ============================================================

- name: Common setup for all servers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - htop
          - net-tools
          - python3-pip
        state: present

    - name: Set timezone to UTC
      timezone:
        name: UTC

    - name: Create devops user
      user:
        name: devops
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

# -------------------------------------------------------
- name: Configure web servers with Node.js app
  hosts: web_servers
  become: true

  vars:
    app_version: "1.0.0"
    app_port: 3000
    node_version: "20"

  tasks:
    - name: Install Node.js {{ node_version }}.x
      block:
        - name: Add NodeSource repository
          shell: |
            curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
          args:
            creates: /etc/apt/sources.list.d/nodesource.list

        - name: Install nodejs
          apt:
            name: nodejs
            state: present

    - name: Install Docker
      block:
        - name: Add Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present

        - name: Install docker-ce
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
            state: present

        - name: Start and enable Docker
          systemd:
            name: docker
            state: started
            enabled: yes

        - name: Add ubuntu user to docker group
          user:
            name: ubuntu
            groups: docker
            append: yes

    - name: Deploy application
      block:
        - name: Create app directory
          file:
            path: /opt/devops-app
            state: directory
            owner: devops
            mode: "0755"

        - name: Pull latest Docker image
          docker_image:
            name: devops-sample-app
            tag: "{{ app_version }}"
            source: pull

        - name: Run application container
          docker_container:
            name: devops-app
            image: "devops-sample-app:{{ app_version }}"
            state: started
            restart_policy: unless-stopped
            ports:
              - "{{ app_port }}:3000"
            env:
              NODE_ENV: production
              APP_VERSION: "{{ app_version }}"

    - name: Configure Nginx reverse proxy
      block:
        - name: Install Nginx
          apt:
            name: nginx
            state: present

        - name: Write Nginx site config
          copy:
            dest: /etc/nginx/sites-available/devops-app
            content: |
              server {
                  listen 80;
                  server_name _;

                  location / {
                      proxy_pass http://localhost:{{ app_port }};
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                  }
              }
            mode: "0644"

        - name: Enable Nginx site
          file:
            src: /etc/nginx/sites-available/devops-app
            dest: /etc/nginx/sites-enabled/devops-app
            state: link

        - name: Remove default Nginx site
          file:
            path: /etc/nginx/sites-enabled/default
            state: absent

        - name: Reload Nginx
          systemd:
            name: nginx
            state: reloaded

    - name: Install and configure Node Exporter (Prometheus)
      block:
        - name: Download Node Exporter
          get_url:
            url: https://github.com/prometheus/node_exporter/releases/download/v1.8.0/node_exporter-1.8.0.linux-amd64.tar.gz
            dest: /tmp/node_exporter.tar.gz

        - name: Extract Node Exporter
          unarchive:
            src: /tmp/node_exporter.tar.gz
            dest: /usr/local/bin/
            remote_src: yes
            extra_opts: [--strip-components=1]

        - name: Create Node Exporter systemd service
          copy:
            dest: /etc/systemd/system/node_exporter.service
            content: |
              [Unit]
              Description=Node Exporter
              After=network.target

              [Service]
              ExecStart=/usr/local/bin/node_exporter
              Restart=always
              User=nobody

              [Install]
              WantedBy=multi-user.target
            mode: "0644"

        - name: Start Node Exporter
          systemd:
            name: node_exporter
            state: started
            enabled: yes
            daemon_reload: yes

# -------------------------------------------------------
- name: Verify deployment
  hosts: web_servers
  tasks:
    - name: Check app health endpoint
      uri:
        url: "http://localhost:3000/health"
        return_content: yes
        status_code: 200
      register: health_check

    - name: Display health response
      debug:
        var: health_check.json
