version: "3.9"

services:
  app:
    build:
      context: ../../../app
      dockerfile: ../lab2-containerization-kubernetes/dockerfiles/Dockerfile
    image: devops-sample-app:latest
    container_name: devops-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_VERSION=1.0.0
    env_file:
      - .env.example
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    volumes:
      - app-logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  app-logs:

networks:
  app-network:
    driver: bridge
